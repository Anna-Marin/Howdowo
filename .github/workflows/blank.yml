name: Burndown
on:
  schedule:
    - cron: "0 18 * * *"   # cada día a las 18:00 UTC
  workflow_dispatch:        # para lanzarlo a mano

permissions:
  contents: write

concurrency:
  group: burndown
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
      OWNER: Anna-Marin
      PROJECT_NUMBER: 1
    steps:
      - uses: actions/checkout@v4

      - name: Descargar items del Project
        run: gh project item-list "$PROJECT_NUMBER" --owner "$OWNER" --limit 500 --format json > items.json

      - name: Calcular pendiente y dibujar gráfico
        run: |
          mkdir -p burndown
          python3 - <<'EOF'
          import json, csv, os, datetime as dt

          today = dt.date.today()
          items = json.load(open('items.json'))['items']

          cur, start, end, title = [], None, None, None
          for i in items:
              s = i.get('sprint')
              if not s: continue
              st = dt.date.fromisoformat(s['startDate'])
              en = st + dt.timedelta(days=s['duration'])
              if st <= today < en:
                  cur.append(i); start, end, title = st, en, s['title']

          if not cur:
              print("No hay sprint activo"); raise SystemExit

          def hrs(i):
              try: return float(i.get('time estimated') or 0)
              except: return 0.0

          total = sum(hrs(i) for i in cur)
          remaining = sum(hrs(i) for i in cur if i.get('status') != 'Done')

          # Totales por día
          path = 'burndown/data.csv'
          rows = []
          if os.path.exists(path):
              rows = list(csv.reader(open(path)))[1:]
          rows = [r for r in rows if r[0] != str(today)]
          rows.append([str(today), title, remaining, total])
          with open(path, 'w', newline='') as f:
              w = csv.writer(f)
              w.writerow(['date', 'sprint', 'remaining_hours', 'total_hours'])
              w.writerows(rows)

          # Detalle por ticket y día
          tpath = 'burndown/tickets.csv'
          trows = []
          if os.path.exists(tpath):
              trows = [r for r in list(csv.reader(open(tpath)))[1:] if r[0] != str(today)]
          for i in cur:
              c = i.get('content', {})
              trows.append([str(today), title, c.get('number', ''), c.get('title', ''), i.get('status', ''), hrs(i)])
          with open(tpath, 'w', newline='') as f:
              w = csv.writer(f)
              w.writerow(['date', 'sprint', 'issue', 'title', 'status', 'hours'])
              w.writerows(trows)

          # Gráfico SVG del sprint actual
          data = [(dt.date.fromisoformat(r[0]), float(r[2]), float(r[3])) for r in rows if r[1] == title]
          data.sort()
          days = max((end - start).days, 1)
          ymax = max(max(d[2] for d in data), max(d[1] for d in data), 1)
          W, H, L, B, T, R = 720, 400, 60, 50, 40, 20

          def X(d): return L + (d - start).days / days * (W - L - R)
          def Y(v): return T + (1 - v / ymax) * (H - T - B)

          ideal = f"{X(start)},{Y(data[0][2])} {X(end)},{Y(0)}"
          actual = " ".join(f"{X(d)},{Y(r)}" for d, r, _ in data)
          dots = "".join(f'<circle cx="{X(d)}" cy="{Y(r)}" r="5" fill="#2da44e"/>' for d, r, _ in data)
          svg = f'''<svg xmlns="http://www.w3.org/2000/svg" width="{W}" height="{H}" font-family="sans-serif" font-size="12">
          <rect width="100%" height="100%" fill="white"/>
          <text x="{L}" y="24" font-size="16" font-weight="bold">Burndown - {title}</text>
          <line x1="{L}" y1="{H-B}" x2="{W-R}" y2="{H-B}" stroke="#888"/>
          <line x1="{L}" y1="{T}" x2="{L}" y2="{H-B}" stroke="#888"/>
          <text x="{L}" y="{H-B+20}">{start}</text>
          <text x="{W-R-60}" y="{H-B+20}">{end}</text>
          <text x="8" y="{T+4}">{ymax:g} h</text>
          <text x="8" y="{H-B}">0</text>
          <polyline points="{ideal}" fill="none" stroke="#999" stroke-dasharray="6 4" stroke-width="2"/>
          <polyline points="{actual}" fill="none" stroke="#2da44e" stroke-width="3"/>
          {dots}
          <text x="{W-200}" y="24" fill="#999">--- Ideal</text>
          <text x="{W-120}" y="24" fill="#2da44e">— Real</text>
          </svg>'''
          open('burndown/burndown.svg', 'w').write(svg)
          EOF

      - name: Guardar cambios
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add burndown
          git diff --cached --quiet && exit 0
          git commit -m "Burndown $(date -u +%F)"
          git pull --rebase -X theirs origin main
          git push
